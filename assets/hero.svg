<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">tech-stack-icons</title>
  <desc id="d">Animated isometric cube with orbiting technology icon chips. Open-source SVG icon library by pawang-ai.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.6" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ffbe6"/><stop offset="1" stop-color="#3ac7ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7bff"/><stop offset="1" stop-color="#2a3fb8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5cff"/><stop offset="1" stop-color="#4a2aa8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7ffbe6"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="cube">
      <polygon points="0,-70 60.6,-35 0,0 -60.6,-35" fill="url(#top)"/>
      <polygon points="-60.6,-35 0,0 0,70 -60.6,35" fill="url(#left)"/>
      <polygon points="60.6,-35 60.6,35 0,70 0,0" fill="url(#right)"/>
      <path d="M-60.6,-35 L0,-70 L60.6,-35 M0,0 L0,70 M0,0 L-60.6,-35 M0,0 L60.6,-35" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    </g>
    <path id="orbit" d="M-330,0 A330,78 0 1,1 330,0 A330,78 0 1,1 -330,0"/>
  </defs>

  <style>
    .float  { animation: bob 5s ease-in-out infinite; }
    .float2 { animation: bob 6.5s ease-in-out infinite; animation-delay: -2s; }
    .float3 { animation: bob 7.5s ease-in-out infinite; animation-delay: -4s; }
    .spin   { transform-origin: 0 0; animation: spin 14s linear infinite; }
    .star   { animation: tw 3.2s ease-in-out infinite; }
    .chip   { font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0b1020; }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes tw   { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .float,.float2,.float3,.spin,.star { animation: none; } }
  </style>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <g fill="#bcd0ff">
    <circle class="star" cx="90"  cy="60"  r="1.6"/>
    <circle class="star" cx="210" cy="140" r="1.2" style="animation-delay:-1s"/>
    <circle class="star" cx="330" cy="40"  r="1.4" style="animation-delay:-2s"/>
    <circle class="star" cx="470" cy="95"  r="1.1" style="animation-delay:-.5s"/>
    <circle class="star" cx="760" cy="48"  r="1.5" style="animation-delay:-1.6s"/>
    <circle class="star" cx="930" cy="120" r="1.2" style="animation-delay:-2.4s"/>
    <circle class="star" cx="1080" cy="64" r="1.6" style="animation-delay:-.8s"/>
    <circle class="star" cx="1130" cy="230" r="1.1" style="animation-delay:-1.9s"/>
    <circle class="star" cx="70"  cy="260" r="1.3" style="animation-delay:-2.8s"/>
  </g>

  <ellipse cx="600" cy="215" rx="240" ry="150" fill="url(#glow)"/>
  <ellipse cx="600" cy="292" rx="95" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>

  <g transform="translate(600 215) rotate(-9)">
    <use href="#orbit" fill="none" stroke="#7ffbe6" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 9"/>
  </g>

  <g transform="translate(330 262)"><g class="float2"><use href="#cube" transform="scale(0.42)"/></g></g>
  <g transform="translate(884 150)"><g class="float3"><use href="#cube" transform="scale(0.34)"/></g></g>
  <g transform="translate(600 190)"><g class="float"><use href="#cube"/></g></g>

  <g transform="translate(600 215) rotate(-9)">
    <g>
      <rect x="-19" y="-14" width="38" height="28" rx="8" fill="#ffd84d"/><text class="chip" x="0" y="6" text-anchor="middle">JS</text>
      <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </g>
    <g>
      <rect x="-19" y="-14" width="38" height="28" rx="8" fill="#5fd0ff"/><text class="chip" x="0" y="6" text-anchor="middle">Go</text>
      <animateMotion dur="14s" begin="-3.5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </g>
    <g>
      <rect x="-19" y="-14" width="38" height="28" rx="8" fill="#7ffbe6"/><text class="chip" x="0" y="6" text-anchor="middle">Py</text>
      <animateMotion dur="14s" begin="-7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </g>
    <g>
      <rect x="-19" y="-14" width="38" height="28" rx="8" fill="#c9a8ff"/><text class="chip" x="0" y="6" text-anchor="middle">Rs</text>
      <animateMotion dur="14s" begin="-10.5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </g>
  </g>

  <text x="600" y="364" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#title)">tech-stack-icons</text>
  <text x="600" y="400" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9fb0e0">Open-source SVG icons for languages, frameworks, tools, cloud and AI</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
